name: CI

# Même vérification que le hook pre-push, mais côté GitHub : elle tourne aussi
# quand quelqu'un pousse en contournant les hooks (`--no-verify`).
on:
  push:
    branches: [master, cms-supabase]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run knip
